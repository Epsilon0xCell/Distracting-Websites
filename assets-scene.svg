<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img" aria-label="The Holographic Scale: a browser window weighed against a glowing target, orbs of light rising like questions">
<rect width="800" height="190" fill="#1c1826"/>
<circle cx="120" cy="150" r="3" fill="#2dd4bf"><animate attributeName="cy" values="150;40" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="680" cy="160" r="2.5" fill="#8b5cf6"><animate attributeName="cy" values="160;50" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="240" cy="165" r="2" fill="#c4b5fd"><animate attributeName="cy" values="165;60" dur="4.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle>
<g><animateTransform attributeName="transform" type="rotate" values="-3 400 42;3 400 42;-3 400 42" dur="4.6s" repeatCount="indefinite"/>
<line x1="190" y1="42" x2="610" y2="42" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
<line x1="250" y1="42" x2="215" y2="92" stroke="#2dd4bf" stroke-width="2.5"/><line x1="250" y1="42" x2="285" y2="92" stroke="#2dd4bf" stroke-width="2.5"/>
<path d="M200 92 h100 a50 14 0 0 1 -100 0 Z" fill="#2dd4bf" opacity="0.35" stroke="#2dd4bf" stroke-width="2"/>
<rect x="222" y="58" width="56" height="34" rx="4" fill="none" stroke="#c4b5fd" stroke-width="3"/><line x1="222" y1="68" x2="278" y2="68" stroke="#c4b5fd" stroke-width="2"/><circle cx="229" cy="63" r="2.2" fill="#2dd4bf"/><circle cx="237" cy="63" r="2.2" fill="#8b5cf6"/>
<line x1="550" y1="42" x2="515" y2="92" stroke="#2dd4bf" stroke-width="2.5"/><line x1="550" y1="42" x2="585" y2="92" stroke="#2dd4bf" stroke-width="2.5"/>
<path d="M500 92 h100 a50 14 0 0 1 -100 0 Z" fill="#8b5cf6" opacity="0.35" stroke="#8b5cf6" stroke-width="2"/>
<circle cx="550" cy="76" r="17" fill="none" stroke="#2dd4bf" stroke-width="3"/><circle cx="550" cy="76" r="10" fill="none" stroke="#8b5cf6" stroke-width="3"/><circle cx="550" cy="76" r="4" fill="#c4b5fd"><animate attributeName="r" values="3.4;4.8;3.4" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<line x1="400" y1="30" x2="400" y2="150" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/><circle cx="400" cy="26" r="7" fill="#2dd4bf"/>
<path d="M362 158 h76 l10 16 h-96 Z" fill="#8b5cf6" opacity="0.8"/>
<line x1="60" y1="174" x2="740" y2="174" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
</svg>